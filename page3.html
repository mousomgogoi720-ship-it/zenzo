<!DOCTYPE html>
<html>
<head>
<title>Choose a Gift 🎁</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
background:linear-gradient(-45deg,#ff4d6d,#ff758f,#ff9a9e,#845ec2);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
font-family:Poppins,sans-serif;
overflow:hidden;
}

/* Background animation */
@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Floating hearts */
.heart{
position:absolute;
color:#ff2f6d;
font-size:24px;
animation:floatUp 7s linear infinite;
opacity:0.9;
z-index:1;
pointer-events:none;
text-shadow:0 0 10px #ff2f6d;
}

@keyframes floatUp{
0%{transform:translateY(100vh);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* Title */
h1{
position:absolute;
top:30px;
width:100%;
text-align:center;
color:white;
z-index:2;
}

/* Area */
.area{
position:relative;
width:100%;
height:100%;
z-index:2;
}

/* Slot */
.slot{
position:absolute;
width:150px;
height:220px;
cursor:pointer;
}

/* Box */
.box{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
}

/* Photo */
.photo{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
border-radius:15px;
opacity:0;
transform:scale(0.7);
transition:0.6s;
}

/* Open animation */
.open .box{
opacity:0;
}

.open .photo{
opacity:1;
transform:scale(1);
}

/* Positions */
.s1{top:20%; left:18%; transform:rotate(-20deg);}
.s2{top:18%; left:42%; transform:rotate(0deg);}
.s3{top:20%; right:18%; transform:rotate(20deg);}
.s4{bottom:22%; left:28%; transform:rotate(15deg);}
.s5{bottom:22%; right:28%; transform:rotate(-15deg);}

/* Continue Button */
#continueBtn{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
padding:15px 45px;
border:none;
border-radius:40px;
background:#00ffd5;
font-size:18px;
display:none;
box-shadow:0 0 20px #00ffd5;
cursor:pointer;
z-index:2;
}

</style>
</head>

<body>

<h1>Choose a Gift 🎁</h1>

<div id="hearts"></div>

<div class="area">

<div class="slot s1" onclick="openSlot(this)">
<img src="gift.png" class="box">
<img src="photo1.jpg" class="photo">
</div>

<div class="slot s2" onclick="openSlot(this)">
<img src="gift.png" class="box">
<img src="photo2.jpg" class="photo">
</div>

<div class="slot s3" onclick="openSlot(this)">
<img src="gift.png" class="box">
<img src="photo6.jpg" class="photo">
</div>

<div class="slot s4" onclick="openSlot(this)">
<img src="gift.png" class="box">
<img src="photo7.jpeg" class="photo">
</div>

<div class="slot s5" onclick="openSlot(this)">
<img src="gift.png" class="box">
<img src="photo8.jpeg" class="photo">
</div>

<button id="continueBtn" onclick="goNext()">CONTINUE 😏</button>

</div>

<script>

function openSlot(slot){
if(slot.classList.contains("open")) return;
slot.classList.add("open");
document.getElementById("continueBtn").style.display="block";
}

/* Create floating hearts */
function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(5+Math.random()*3)+"s";
document.getElementById("hearts").appendChild(heart);

setTimeout(()=>{heart.remove();},8000);
}

setInterval(createHeart,250);

function goNext(){
window.location.href="page4.html";
}

</script>

</body>
</html>
