<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Step 2 😏</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#020024,#090979,#00d4ff,#020024);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
font-family:Poppins,sans-serif;
overflow:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* PARTICLES */
.particle{
position:absolute;
font-size:14px;
animation:float 6s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* CENTER */
.box{
text-align:center;
color:white;
animation:fade 2s;
}

@keyframes fade{
from{opacity:0;transform:scale(0.8);}
to{opacity:1;transform:scale(1);}
}

h1{
font-size:3rem;
text-shadow:0 0 20px cyan;
margin-bottom:10px;
}

p{
opacity:0.8;
}

button{
padding:15px 40px;
margin:20px;
border:none;
border-radius:40px;
font-size:17px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

.yes{
background:#00ffd5;
box-shadow:0 0 20px #00ffd5;
}

.no{
background:#ff4d6d;
color:white;
box-shadow:0 0 20px #ff4d6d;
animation:shake 1.5s infinite;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-3px);}
50%{transform:translateX(3px);}
75%{transform:translateX(-3px);}
100%{transform:translateX(0);}
}

</style>
</head>

<body>

<div class="box">
<h1>Are you REALLY sure? 😏</h1>
<p>After this, there is no going back...</p>

<button class="yes" onclick="next()">YES – Continue</button>
<button class="no" onclick="next()">NO – Take me back</button>
</div>

<script>

function next(){
window.location.href="page3.html";
}

function particle(){
const p=document.createElement("div");
p.className="particle";
p.innerHTML="✨";
p.style.left=Math.random()*100+"vw";
document.body.appendChild(p);
setTimeout(()=>p.remove(),6000);
}

setInterval(particle,300);

</script>

</body>
</html>
