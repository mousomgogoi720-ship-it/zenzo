<!DOCTYPE html>
<html>
<head>
<title>Your Destiny 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
background:radial-gradient(circle at top,#1b0035,#000);
overflow:hidden;
font-family:Poppins,sans-serif;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

/* ================= BACKGROUND STARS ================= */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.7;
animation:fall 6s linear infinite;
}

@keyframes fall{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* ================= SMOKE ================= */

#smokeLayer{
position:fixed;
inset:0;
pointer-events:none;
z-index:10;
overflow:hidden;
}

.smoke{
position:absolute;
width:300px;
height:300px;
background:radial-gradient(circle,rgba(200,200,200,.35),rgba(0,0,0,0));
border-radius:50%;
filter:blur(40px);
animation:smokeMove 3s ease-out forwards;
}

@keyframes smokeMove{
0%{transform:scale(.3);opacity:0;}
40%{opacity:.8;}
100%{transform:scale(2);opacity:0;}
}

/* ================= UI ================= */

.container{
text-align:center;
z-index:2;
}

.cards{
display:flex;
gap:30px;
margin-top:25px;
}

.card{
width:140px;
height:200px;
background:linear-gradient(135deg,#ff4d6d,#ff9a9e);
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
font-size:1.2rem;
box-shadow:0 0 25px #ff4d6d;
transition:.4s;
}

.card:hover{transform:scale(1.1);}

#result{
display:none;
margin-top:30px;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

button{
margin-top:15px;
padding:14px 35px;
border:none;
border-radius:40px;
background:#00ffd5;
font-size:16px;
cursor:pointer;
box-shadow:0 0 20px #00ffd5;
}

.back{
background:#ff4d6d;
box-shadow:0 0 20px #ff4d6d;
color:white;
}

h1{text-shadow:0 0 20px pink;}

</style>
</head>

<body>
<div id="smokeLayer"></div>

<div class="container">

<!-- CARD SELECTION -->
<div id="cardsArea">
<h1>The universe is choosing your destiny…</h1>
<p>Choose one destiny</p>

<div class="cards">
<div class="card" onclick="cardOne()">Destiny 1</div>
<div class="card" onclick="cardTwo()">Destiny 2</div>
<div class="card" onclick="cardThree()">Destiny 3</div>
</div>
</div>

<!-- RESULT -->
<div id="result">
<h2 id="resultText"></h2>

<button id="acceptBtn" onclick="acceptLove()">ACCEPT 😍</button><br>
<button class="back" onclick="goBack()">Choose another card</button>
</div>

</div>

<script>

/* STARS */
setInterval(()=>{
const s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
document.body.appendChild(s);
setTimeout(()=>s.remove(),6000);
},120);

/* SMOKE */
function launchSmoke(){
for(let i=0;i<40;i++){
const s=document.createElement("div");
s.className="smoke";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.getElementById("smokeLayer").appendChild(s);
setTimeout(()=>s.remove(),3000);
}
}

/* SHOW RESULT */
function showResult(text,accept){
document.getElementById("cardsArea").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("resultText").innerHTML=text;
document.getElementById("acceptBtn").style.display =
accept ? "inline-block" : "none";
}

/* CARD ACTIONS */
function cardOne(){
launchSmoke();
setTimeout(()=>{
showResult("Your destiny is...<br><br><h1>Being my Valentine 💘</h1>",true);
},700);
}

function cardTwo(){
launchSmoke();
setTimeout(()=>{
showResult("🤡<br><br><h1>Choose Card 3</h1>",false);
},700);
}

function cardThree(){
launchSmoke();
setTimeout(()=>{
showResult("hehehehe...<br><br>aitu moi bonua code hoi...<br><br><h1>Choose Card 1</h1>",false);
},700);
}

/* ACCEPT → PAGE 5 */
function acceptLove(){
window.location.href = "page5.html";
}

/* BACK */
function goBack(){
document.getElementById("result").style.display="none";
document.getElementById("cardsArea").style.display="block";
}

</script>

</body>
</html>
